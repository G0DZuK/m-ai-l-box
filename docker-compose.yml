# Local development stack.
#
#   cp .env.example .env      # then edit SECRET_KEY etc.
#   docker compose up --build
#
# Web UI + API:        http://localhost:8000      (API docs: http://localhost:8000/api/docs)
# SMTP receiver:       localhost:2525             (point the app you are testing here)
# MinIO console:       http://localhost:9001      (local only)
#
# NOTE: this stack receives mail that is sent DIRECTLY to localhost:2525. It does NOT make your
# addresses reachable from the public internet — that needs DNS (MX records) and a reachable inbound
# service. See docs/DEPLOYMENT.md.

x-app: &app
  build: .
  image: mailbox-app:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://mailbox:mailbox@postgres:5432/mailbox
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mailbox}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mailbox-local-only}
    S3_BUCKET: mailbox
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mailbox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mailbox-local-only}
    ports: ["127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-mailbox}" "$${MINIO_ROOT_PASSWORD:-mailbox-local-only}" &&
        mc mb --ignore-existing local/mailbox &&
        mc anonymous set none local/mailbox
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mailbox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mailbox-local-only}

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  beat:
    <<: *app
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis: {condition: service_healthy}

  smtp:
    <<: *app
    command: ["python", "-m", "app.inbound.smtp_server"]
    ports: ["127.0.0.1:2525:2525"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # Optional malware scanning:  docker compose --profile clamav up   (and set SCANNER=clamav)
  clamav:
    image: clamav/clamav:1.4.1
    profiles: ["clamav"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
